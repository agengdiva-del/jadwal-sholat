    <script>
      (function() {
        // 1. Intercept and suppress external Chrome Extension errors (e.g. requests.js / 200.js)
        var isSuppressedError = function(msg, url, stack) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + String(stack || '');
          return str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('Cannot set property fetch of #<Window>') !== -1 ||
                 (str.indexOf('fetch') !== -1 && str.indexOf('has only a getter') !== -1);
        };

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var url = event.filename || '';
          var stack = (event.error && event.error.stack) ? event.error.stack : '';
          if (isSuppressedError(msg, url, stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var str = (reason && reason.stack) ? reason.stack : String(reason);
          if (isSuppressedError(str, '', '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          var stack = error && error.stack ? error.stack : '';
          if (isSuppressedError(msg, url, stack)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        // 2. Define writable/configurable fetch setter so extensions that assign window.fetch succeed
        try {
          var _rawFetch = window.fetch ? window.fetch.bind(window) : null;
          var _storedFetch = _rawFetch;

          var applyProperty = function(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _storedFetch || _rawFetch;
                },
                set: function(val) {
                  _storedFetch = val;
                }
              });
            } catch (err) {
              try {
                target.fetch = function() {
                  return (_storedFetch || _rawFetch).apply(this, arguments);
                };
              } catch (_) {}
            }
          };

          applyProperty(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            applyProperty(Window.prototype);
          }
        } catch (e) {}
      })();
    </script>
